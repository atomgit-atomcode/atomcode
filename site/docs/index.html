<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AtomCode 文档 / Documentation</title>
<meta http-equiv="refresh" content="0; url=./zh/index.html">
<script>
(function(){
  var lang = 'zh';
  try {
    if (localStorage.getItem('atomcode_lang') === 'en') lang = 'en';
  } catch (e) {}
  var requested = new URLSearchParams(location.search).get('lang');
  if (requested === 'en' || requested === 'zh') lang = requested;
  location.replace('./' + lang + '/index.html' + location.hash);
})();
</script>
</head>
<body>
<p>Redirecting to <a href="./zh/index.html">中文文档</a> / <a href="./en/index.html">English docs</a>…</p>
</body>
</html>
