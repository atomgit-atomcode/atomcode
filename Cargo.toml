[workspace]
resolver = "2"
# Glob picks up the closed-source `atomcode-codingplan-crypto` overlay
# the official build pipeline drops into `crates/` (see the stub at
# `crates/atomcode-codingplan-crypto/`). Adding any future crate is also
# a no-toml-edit operation.
members = ["crates/*"]
# `atomcode-codingplan-crypto` is intentionally absent from default-members:
# the stub is wired into atomcode-auth via an optional dep behind the
# final binary's `codingplan-crypto` feature, so a default `cargo build`
# from the workspace root has no reason to compile it. The official build
# picks it up explicitly via `--features atomcode/codingplan-crypto`.
default-members = [
    "crates/atomcode-cli",
    "crates/atomcode-daemon",
    "crates/atomcode-telemetry",
    "crates/atomcode-tuix",
]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Link-time optimization — eliminates dead code across crates
codegen-units = 1      # Single codegen unit — better optimization, slower build
strip = true           # Strip symbols automatically
panic = "abort"        # Remove panic unwinding code — saves ~200-500KB

[profile.test]
debug = "line-tables-only" # Smaller binaries, faster linker

# workspace 内自己的 crate 也只留行号表(2026-09-18)。默认的 `debug = 2` 会为
# 这 40 万行自己的代码生成完整 DWARF —— 它进 `.rlib`、进每一个 test binary、
# 再由链接器串进 160MB 的 debug 二进制里,是 `target/` 体积与链接时间的另一半
# (量过一次:一个 worktree 的 target 56G,其中 deps 34G、incremental 21G)。
# **代价说清楚**:panic 与 backtrace 仍有函数名和行号,`profile.test` 本来就是
# 这一档;失去的是调试器里看局部变量和单步的类型信息。真要单步调试某个 crate,
# 临时加 `[profile.dev.package.atomcode-xxx] debug = 2` 再编那一个包。
#
# 注意:改 profile 会让**所有** worktree 的 target 整体失效,下一次编译是全量。
[profile.dev]
debug = "line-tables-only"

# 487 个依赖的完整 DWARF 同理,而开发时几乎不会单步进第三方库 —— 依赖这一档
# 更进一步,连行号也不留(`debug = 0`),panic 里仍有符号名。
# `cargo test` 的依赖走 dev profile,所以这条对 test 路径同样生效。
[profile.dev.package."*"]
debug = 0

[workspace.package]
version = "5.0.9"
edition = "2021"
license = "MIT"
repository = "https://atomgit.com/atomgit_atomcode/atomcode"
description = "Open-source terminal AI coding agent"

[workspace.dependencies]
agent-client-protocol = "=2.0.0"
anyhow = "1"
similar = "2"
