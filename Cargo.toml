[workspace]
resolver = "2"
members = [
    "crates/atomcode-core",
    "crates/atomcode-tui",
    "crates/atomcode-cli",
    "crates/atomcode-api",
]

[workspace.package]
version = "2.3.0"
edition = "2021"
license = "MIT"
repository = "https://gitcode.com/bangxu/atomcode"
description = "Open-source terminal AI coding agent"
