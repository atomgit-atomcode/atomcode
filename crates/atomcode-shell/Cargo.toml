[package]
name = "atomcode-shell"
version = "0.0.0"
edition = "2021"
description = "The driver shell: neutral provider/glue helpers shared by the cli + daemon drivers — ShellConfig + coding_config + build_provider (with AtomGit signing) + core↔kernel message convert. There is no translation runtime; tuix and the daemon consume the kernel natively."

[dependencies]
# Driver-side provider construction: core supplies crypto (signing gateway) + i18n +
# the message types convert maps; capabilities supplies the provider adapters + the
# RequestSigner trait; coding supplies CodingAgentConfig; kernel supplies the provider
# trait + message types. build_provider can't live in coding (coding is core-neutral).
atomcode-core = { path = "../atomcode-core" }
atomcode-kernel = { path = "../atomcode-kernel" }
atomcode-capabilities = { path = "../atomcode-capabilities", features = ["provider"] }
atomcode-coding = { path = "../atomcode-coding" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
anyhow = "1"
url = "2"
getrandom = "0.2"
