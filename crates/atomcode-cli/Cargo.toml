[package]
name = "atomcode"
version.workspace = true
edition.workspace = true
default-run = "atomcode"

[[bin]]
name = "atomcode"
path = "src/main.rs"

# Thin lib target so integration tests (and the bin) can reach testable
# modules like `uninstall` (moved here from atomcode-core). A bin-only crate
# exposes no API to `tests/`, which is why the uninstall manifest used to
# live in core just to be reachable from script_parity.rs.
[lib]
name = "atomcode"
path = "src/lib.rs"

[features]
default = []
distro-pm = ["atomcode-core/distro-pm", "atomcode-tuix/distro-pm"]

[dependencies]
atomcode-core = { path = "../atomcode-core" }
atomcode-askpass = { path = "../atomcode-askpass" }
# Engine v2: the new stack presented through the legacy channel protocol.
atomcode-bridge = { path = "../atomcode-bridge" }
# ACP (Agent Client Protocol) stdio server mode.
atomcode-acp = { path = "../atomcode-acp" }
atomcode-tuix = { path = "../atomcode-tuix" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
atomcode-daemon = { path = "../atomcode-daemon" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
is-terminal = "0.4"
# Process scan for the uninstall flow (detect running atomcode instances).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# setsid() for the detached upgrade-prep subprocess. Unix-only — Windows
# uses CREATE_NO_WINDOW creation flags instead (see main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: default HeapAlloc is 3-5x slower than Linux glibc for the
# small-string/Line-clone heavy render loop. mimalloc cuts per-frame alloc
# cost enough to make typing feel smooth again on Windows Terminal / ConHost.
[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
# Registry User PATH cleanup during uninstall.
winreg = "0.55"

# Build-dep for embedding the app icon into atomcode.exe resource section.
# Gated at runtime in build.rs via CARGO_CFG_TARGET_OS so it only fires
# when the *target* is Windows — cross-compile from macOS is the primary
# case. Needs `*-w64-mingw32-windres` on PATH (already required by the
# existing mingw-w64 cross-compile toolchain). The crate is tiny and pure
# Rust, so pulling it in unconditionally on the host side costs ~nothing.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
which = "7"
# Serialize env-var-mutating uninstall tests (moved from atomcode-core).
serial_test = "3"

[build-dependencies]
winresource = "0.1"
