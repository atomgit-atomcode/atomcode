[package]
name = "atomcode"
version.workspace = true
edition.workspace = true
default-run = "atomcode"

[[bin]]
name = "atomcode"
path = "src/main.rs"

# Thin lib target so integration tests (and the bin) can reach testable
# modules like `uninstall` (moved here from atomcode-core). A bin-only crate
# exposes no API to `tests/`, which is why the uninstall manifest used to
# live in core just to be reachable from script_parity.rs.
[lib]
name = "atomcode"
path = "src/lib.rs"

[features]
default = []
distro-pm = ["atomcode-updater/distro-pm", "atomcode-tuix/distro-pm"]

[dependencies]
async-trait = "0.1"
atomcode-core = { path = "../atomcode-core" }
atomcode-codingplan = { path = "../atomcode-codingplan" }
# Config system (leaf crate, extracted from core) — used directly, not via the
# transitional atomcode_core::config re-export shim.
atomcode-config = { path = "../atomcode-config" }
# Self-update mechanics (leaf crate, extracted from core).
atomcode-updater = { path = "../atomcode-updater" }
atomcode-tuix = { path = "../atomcode-tuix" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
atomcode-daemon = { path = "../atomcode-daemon" }
# ACP (Agent Client Protocol) stdio server — the `atomcode acp` subcommand's engine
# lives in `src/acp/`. It composes the v2 stack directly, so cli pulls the layers acp
# uses (kernel + coding + capabilities) + the protocol SDK. capabilities is all-platform
# here (acp is cross-platform); it also covers the unix-only `::askpass` helper below.
agent-client-protocol = { workspace = true }
atomcode-kernel = { path = "../atomcode-kernel" }
atomcode-coding = { path = "../atomcode-coding", features = ["atomgit"] }
atomcode-capabilities = { path = "../atomcode-capabilities", features = ["notify", "setup", "plugin", "mcp", "atomgit", "cc-hooks"] }
atomcode-auth = { path = "../atomcode-auth" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
serde_json = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
is-terminal = "0.4"
# File-only tracing subscriber (see `init_file_logging`). The workspace emits 110+
# `tracing::` diagnostics (e.g. `atomcode-label:` from the git-push label middleware)
# but installed NO subscriber, so they all went to the no-op dispatcher. This wires
# them to `<config_dir>/logs/atomcode.log`, filtered by RUST_LOG.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Process scan for the uninstall flow (detect running atomcode instances).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# setsid() for the detached upgrade-prep subprocess. Unix-only — Windows
# uses CREATE_NO_WINDOW creation flags instead (see main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# NOTE: the `atomcode __askpass` helper (src/askpass.rs, unix-only) uses
# atomcode-capabilities::askpass — now covered by the all-platform capabilities dep
# in [dependencies] above (pulled in for ACP), so no unix-specific entry needed here.

# Windows-only: default HeapAlloc is 3-5x slower than Linux glibc for the
# small-string/Line-clone heavy render loop. mimalloc cuts per-frame alloc
# cost enough to make typing feel smooth again on Windows Terminal / ConHost.
[target.'cfg(target_os = "windows")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization", "Win32_UI_WindowsAndMessaging"] }
# Registry User PATH cleanup during uninstall.
winreg = "0.55"

# Build-dep for embedding the app icon into atomcode.exe resource section.
# Gated at runtime in build.rs via CARGO_CFG_TARGET_OS so it only fires
# when the *target* is Windows — cross-compile from macOS is the primary
# case. Needs `*-w64-mingw32-windres` on PATH (already required by the
# existing mingw-w64 cross-compile toolchain). The crate is tiny and pure
# Rust, so pulling it in unconditionally on the host side costs ~nothing.
[dev-dependencies]
assert_cmd = "2"
# Redirect ATOMCODE_HOME to a throwaway temp dir before any test runs (via a
# #[ctor] in main.rs's #[cfg(test)] module + every tests/*.rs binary) so tests
# never persist into the developer's real ~/.atomcode.
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
predicates = "3"
tempfile = "3"
which = "7"
# Serialize env-var-mutating uninstall tests (moved from atomcode-core).
serial_test = "3"

[build-dependencies]
winresource = "0.1"
