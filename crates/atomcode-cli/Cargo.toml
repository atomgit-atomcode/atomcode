[package]
name = "atomcode"
version.workspace = true
edition.workspace = true

[[bin]]
name = "atomcode"
path = "src/main.rs"

[dependencies]
atomcode-core = { path = "../atomcode-core" }
atomcode-tui = { path = "../atomcode-tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
url = "2"
