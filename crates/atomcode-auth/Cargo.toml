[package]
name = "atomcode-auth"
version.workspace = true
edition = "2021"
license.workspace = true
description = "atomcode OAuth login flow + secure (chmod-600) auth-token file. Leaf crate: depends only on atomcode-config + atomcode-telemetry + reqwest, so any stack layer can authenticate without an atomcode-core dependency."
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
url = "2"
atomcode-config = { path = "../atomcode-config" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
atomcode-codingplan-crypto = { path = "../atomcode-codingplan-crypto", optional = true }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[features]
default = []
codingplan-crypto = ["dep:atomcode-codingplan-crypto"]

[target.'cfg(unix)'.dependencies]
# `tcgetattr`/`tcsetattr` for the cbreak (ESC-to-cancel) terminal guard during login.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `ShellExecuteW` (Win32_UI_Shell) + `SW_SHOWNORMAL` (Win32_UI_WindowsAndMessaging) to open
# the sign-in URL in the default browser without a console flash. `Win32_Foundation` is
# required for the `HWND`/`HINSTANCE` types in ShellExecuteW's signature.
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
# Same-directory atomic credential replacement on Windows.
tempfile = "3"
# Windows: enable reqwest's native-tls backend (SChannel). Some networks RST the
# rustls TLS fingerprint at the connection layer (os error 10054) while SChannel
# (browser/curl-native) passes; making SChannel the default on Windows dodges it.
# Feature-unions with the base `rustls-tls`; keeps `default-features = false`.
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
