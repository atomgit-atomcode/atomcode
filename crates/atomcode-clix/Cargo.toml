[package]
name = "atomcode-clix"
version = "0.0.0"
edition = "2021"
description = "Standalone review CLI: drives the atomcode-review agent over a git diff. Decoupled from atomcode-cli / atomcode-core."

[[bin]]
name = "atomcodex"
path = "src/main.rs"

[dependencies]
atomcode-review = { path = "../atomcode-review" }
atomcode-kernel = { path = "../atomcode-kernel" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
