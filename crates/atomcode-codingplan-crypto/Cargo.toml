[package]
name = "atomcode-codingplan-crypto"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
publish = false
description = "Open-source placeholder for the AtomGit request-signing crate; the real implementation is overlaid by the official-release build pipeline."

[lib]
path = "src/lib.rs"

# Open-source stub: no dependencies and no signing logic. The official build
# (scripts/build-official.sh) replaces this whole directory with the private
# crate, which brings its own Cargo.toml and dependencies.
[dependencies]

# No `[profile.release]` here. This crate is overlaid into the public
# `atomcode` workspace at build time; nested profile blocks in non-root
# workspace members are ignored by Cargo and produce a noisy warning.
# The release profile is defined once at atomcode's workspace root.
