[package]
name = "atomcode-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "atomcode_daemon"
path = "src/lib.rs"

[[bin]]
name = "atomcode-daemon"
path = "src/main.rs"

[dependencies]
atomcode-core = { path = "../atomcode-core" }
# The driver shell (atomcode-shell): BridgeConfig + coding_config + build_provider
# (AtomGit signing) + convert, shared by the daemon's native /live + /chat producers.
atomcode-shell = { path = "../atomcode-shell" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
# Native v2 stack: KernelTurnExecutor drives CodingRuntime directly (no bridge
# membrane), consuming kernel AgentEvents and answering approvals natively.
atomcode-kernel = { path = "../atomcode-kernel" }
atomcode-coding = { path = "../atomcode-coding" }
atomcode-capabilities = { path = "../atomcode-capabilities", features = ["tools"] }

# HTTP
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebUI static embedding
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Async trait support
async-trait = "0.1"

# Utils
dirs = "5"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tokio-util = "0.7"
regex = "1"
tracing = "0.1"
sha2 = "0.10"
# 远程访问二维码（/tunnel/status 的 SVG）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
atomcode-telemetry = { path = "../atomcode-telemetry", features = ["test-util"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
