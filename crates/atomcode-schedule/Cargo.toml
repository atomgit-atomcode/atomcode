[package]
name = "atomcode-schedule"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atomcode-config = { path = "../atomcode-config" }
anyhow = "1"
wait-timeout = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies.chrono]
version = "0.4"

[features]
model-tools = ["dep:atomcode-capabilities"]

[dependencies.atomcode-capabilities]
path = "../atomcode-capabilities"
optional = true
default-features = false
features = ["tools"]

[dependencies.tokio-util]
version = "0.7"
features = ["rt"]

[dev-dependencies]
chrono-tz = "0.10"
