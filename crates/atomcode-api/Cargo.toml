[package]
name = "atomcode-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atomcode-core = { path = "../atomcode-core" }

# HTTP
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
dirs = "5"
