[package]
name = "atomcode-bridge"
version = "0.0.0"
edition = "2021"
description = "Engine bridge: presents atomcode-core's driver-facing channel protocol (AgentClient/AgentCommand/AgentEvent) backed by the NEW stack (kernel + capabilities + coding). Lets every existing driver — tuix, atomcode-cli headless, daemon-attached flows — run the new engine UNCHANGED."

[dependencies]
# THE deliberate layering exemption: this crate is the strangler seam and the ONLY
# place old and new stacks meet. atomcode-core supplies the legacy TYPES (the wire
# vocabulary drivers speak) — its engine is what the bridge replaces.
atomcode-core = { path = "../atomcode-core" }
atomcode-kernel = { path = "../atomcode-kernel" }
atomcode-capabilities = { path = "../atomcode-capabilities", features = ["provider", "tools", "session", "memory", "mcp"] }
atomcode-coding = { path = "../atomcode-coding" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
serde_json = "1"
anyhow = "1"
url = "2"
getrandom = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "3"
