[package]
name = "atomcode-tui"
version.workspace = true
edition = "2021"
description = "A full-screen terminal UI assembled from plugins on atomcode-harness — panels, streams, keymaps and layout are all rows"
publish = false

[[bin]]
name = "atui"
path = "src/bin/atui.rs"

[dependencies]
# The plugin runtime and the agent assembly this UI is a front end for.
atomcode-plexus = { path = "../atomcode-plexus" }
atomcode-harness = { path = "../atomcode-harness" }
# Value types only: SessionEvent carries kernel messages and tool calls.
atomcode-kernel = { path = "../atomcode-kernel" }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
