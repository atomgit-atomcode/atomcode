[package]
name = "atomcode-tui"
version.workspace = true
edition = "2021"
description = "A full-screen terminal UI assembled from plugins on atomcode-harness — panels, streams, keymaps and layout are all rows"
publish = false

[[bin]]
name = "atui"
path = "src/bin/atui.rs"

[dependencies]
# The plugin runtime and the agent assembly this UI is a front end for.
atomcode-plexus = { path = "../atomcode-plexus" }
atomcode-harness = { path = "../atomcode-harness" }
# Value types only: SessionEvent carries kernel messages and tool calls.
atomcode-kernel = { path = "../atomcode-kernel" }
crossterm = { version = "0.29", features = ["event-stream"] }
# Reading the clipboard. The surface is the only row allowed to talk to the
# terminal, and the clipboard is the terminal's — so the platform lives here,
# behind `Surface::clipboard_image`, and everything above it sees an
# `ImageContent` and nothing else.
arboard = "3"
# arboard hands back raw RGBA; every provider wants an encoded image, so the
# encode happens once at this boundary rather than in each provider adapter.
png = "0.17"
base64 = "0.22"
unicode-width = "0.2"
unicode-segmentation = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# Reading the terminal's answer to an OSC 11 query needs the tty as a file
# descriptor with a timeout — `poll` and `read`, which crossterm does not
# expose. Unix only; elsewhere the theme comes from config or `COLORFGBG`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
