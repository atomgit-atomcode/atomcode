[package]
name = "atomcode-capabilities"
version.workspace = true
edition = "2021"
description = "L1 capabilities layered on atomcode-kernel (L0): real provider adapters, tools, mcp, skills. Depends ONLY on the kernel."
publish = false
# The `setup` capability's seeds.rs `include_bytes!`s an archive that this build
# script packs from `assets/setup-seeds/` into OUT_DIR.
build = "build.rs"

[build-dependencies]
# Pack the embedded setup seeds (tar.zst) in build.rs. Cargo can't feature-gate
# [build-dependencies], so these compile for every capabilities build; the packer itself
# is gated on CARGO_FEATURE_SETUP so a lean (no-setup) build skips the packing work. Light,
# build-only (never shipped in the binary).
zstd = "0.13"
tar = "0.4"

[dependencies]
# L0 only. NEVER add atomcode-core or any L2/L3 crate here (layering is compile-enforced).
atomcode-kernel = { path = "../atomcode-kernel" }
atomcode-auth = { path = "../atomcode-auth", optional = true }
# Leaf config crate (sits below core). The `notify` capability reads NotificationConfig;
# the config crate is explicitly designed so every stack layer can read config without an
# atomcode-core dep. Optional + behind the `notify` feature so a provider-only / lean
# embedder that never wants desktop notifications does not drag config→telemetry (and its
# reqwest/rustls/flate2 stack) into the build — same optionality discipline as reqwest above.
atomcode-config = { path = "../atomcode-config", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
# `tools` capability: the `task` subagent tool names `CancellationToken` in a struct field
# (the progress hook gates emits on the child's cancel). Already in-tree via kernel; opt-in
# so a provider-only embedder skips it.
tokio-util = { version = "0.7", optional = true }
# `provider` capability deps (HTTP + SSE). Optional so a downstream embedder that
# only wants other capabilities does not pull in the TLS/HTTP stack.
# `rustls-tls` (webpki base) — an INFALLIBLE base so `.build()` never hard-fails
# on certs. OS native roots + SSL_CERT_FILE are layered on TOP, gracefully, in
# `build_http_client` (`add_trusted_roots`). NOT `rustls-tls-native-roots`:
# reqwest reads native roots / SSL_CERT_FILE STRICTLY there and fails the build
# ("zero valid certificates …") on a bad SSL_CERT_FILE or empty store, which
# cascades into panics at every `.build()` site. This is the DEFAULT v2 provider
# path; the whole-workspace feature must stay `rustls-tls`. See issue #514.
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"], default-features = false, optional = true }
# OS native root store loader for corporate MITM-proxy CAs. Best-effort. #514.
rustls-native-certs = { version = "0.8", optional = true }
# rustls (parser only, no crypto provider) to PRE-VALIDATE each OS root before we
# hand it to reqwest. reqwest feeds added roots to `rustls::RootCertStore::add` at
# `.build()` and aborts the WHOLE client on the first cert rustls rejects, so we
# mirror reqwest's own tolerant native loader and drop the bad ones. Already in the
# tree via reqwest's `rustls-tls`; `default-features = false` + `std` avoids pulling
# a second crypto provider. See issue #514.
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
# RFC 7231 HTTP-date parsing for `Retry-After` headers that use the date form (e.g. some
# Anthropic 429s) instead of delta-seconds. Already in the tree via reqwest. provider-only.
httpdate = { version = "1", optional = true }
# Precisely identify hyper's `IncompleteMessage` (the server closed the connection
# before the response message completed). That error does NOT wrap an io::Error, so
# `chain_has_transient_io` cannot see it — it surfaced as a hard-failed
# `open failed: … connection closed before message completed` with ZERO retries.
# Already in-tree (transitive via reqwest); promoted to a direct dependency only so
# we can downcast to it. provider-only.
hyper = { version = "1", optional = true }
getrandom = { version = "0.2", optional = true }
tracing = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
async-stream = { version = "0.3", optional = true }
# `tools` capability deps. gitignore-aware file walking (grep/glob), regex (grep),
# glob matching (glob). Optional so a provider-only embedder skips them.
ignore = { version = "0.4", optional = true }
regex = { version = "1", optional = true }
# streaming content search (grep) — searches files incrementally / via mmap, never
# loading a whole file into a heap String (unlike a `read_to_string` loop, which OOMs
# on a large file); skips binary; pairs with the `ignore` walker above.
grep = { version = "0.3", optional = true }
globset = { version = "0.4", optional = true }
# Real line diff for edit_file's compact diff (git-style unified hunks + line numbers).
similar = { workspace = true, optional = true }
# Decode subprocess (bash) output that isn't UTF-8: CJK Windows consoles emit OEM
# codepage bytes (GBK/CP936, Big5, …), which otherwise render as `◇◇◇` mojibake.
encoding_rs = { version = "0.8", optional = true }
# Best-effort encoding detection for non-UTF-8 subprocess output on Unix and for
# Windows codepages that are not covered by the explicit OEM mapping above.
chardetng = { version = "0.1", optional = true }
# `codeintel` capability deps (tree-sitter symbol extraction). Heavy C compilation, so
# opt-in (NOT in default) — an embedder that wants only provider/tools skips all grammars.
tree-sitter = { version = "0.26", optional = true }
# `tools` capability: AST-based read-only bash classification (is_read_only_bash walks a
# tree-sitter-bash parse instead of hand-rolled string matching). Shares the vendored
# tree-sitter runtime with codeintel above. Optional so a provider-only embedder skips it.
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
# `lsp` capability deps: detect whether a language server is installed + file:// URIs.
which = { version = "7", optional = true }
url = { version = "2", optional = true }
# `mcp` capability deps: connect external MCP servers (stdio/HTTP/OAuth). `anyhow` is the
# ported transport/registry/oauth internal Result type (never leaks past the Tool adapter,
# which maps it to ToolResult{is_error}); sha2/base64/uuid are the OAuth PKCE primitives;
# dirs replaces core's home-dir helper. Optional — a non-MCP embedder pulls none of this.
anyhow = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# base64 is non-optional: `read_file` always needs it to hand an image file to a
# vision model (encode bytes → data URL). Also used by the `mcp` OAuth PKCE flow.
base64 = { version = "0.22" }
uuid = { version = "1", features = ["v4"], optional = true }
dirs = { version = "6", optional = true }
toml = { version = "0.8", optional = true }
# `session` capability deps: chrono for epoch↔ISO + local-time date math (transcript
# timestamps, current-date injection, recall date filtering). dirs resolves
# $ATOMCODE_HOME/sessions; fs2 serializes per-session meta read-modify-write.
chrono = { version = "0.4", optional = true }
# `setup` also uses fs2 for its install lock; thiserror provides typed setup errors.
# anyhow/sha2/chrono/serde/serde_json/tempfile are shared with other
# capabilities (or already non-optional). Optional so a non-setup embedder skips them.
fs2 = { version = "0.4", optional = true }
thiserror = { version = "1", optional = true }
# `setup`'s fs_atomic writes via a same-dir NamedTempFile → persist. Runtime dep for
# setup (also a dev-dep below for tests). Optional so non-setup builds skip it.
tempfile = { version = "3", optional = true }
# `setup` lock.rs reads host name + process start-time for the advisory install lock
# sentinel (stale-lock detection). Optional so non-setup builds skip it.
sysinfo = { version = "0.32", default-features = false, features = ["system"], optional = true }
# `setup` structured log lines reuse the optional `tracing` dependency declared above.
# `setup` seeds.rs decompresses/unpacks the embedded tar.zst seed archive at first
# run. Same crates as the build-dependencies packer (separate dep trees). Optional.
zstd = { version = "0.13", optional = true }
tar = { version = "0.4", optional = true }

[features]
default = ["provider", "tools"]
# Real LlmProvider adapters (OpenAI-compatible: GLM / DeepSeek / …). `dirs` resolves the
# wire-dump output dir (config_dir()/wire-dump) for the byte-level ATOMCODE_WIRE_DUMP.
provider = ["dep:reqwest", "dep:rustls-native-certs", "dep:rustls", "dep:bytes", "dep:async-stream", "dep:dirs", "dep:httpdate", "dep:atomcode-auth", "dep:atomcode-config", "dep:getrandom", "dep:tracing", "dep:fs2", "dep:hyper"]
# Real neutral coding Tools (fs read/write/edit/list + bash + grep/glob) + a generic
# approval middleware. Pulls fs/process/io tokio features + the search stack.
tools = ["dep:ignore", "dep:regex", "dep:grep", "dep:globset", "dep:encoding_rs", "dep:chardetng", "dep:tokio-util", "dep:similar", "dep:tree-sitter", "dep:tree-sitter-bash", "dep:sha2", "dep:dirs", "tokio/fs", "tokio/process", "tokio/io-util"]
# Network tools (web_fetch / web_search). Opt-in on top of `tools` — pulls the HTTP stack
# (reqwest + url + tokio/net for SSRF DNS checks). NOT in default: a tools-only embedder
# that wants no network egress skips it.
web = ["tools", "dep:reqwest", "dep:url", "tokio/net"]
# AtomGit REST tools (atomgit_repo / atomgit_pr / atomgit_issue). Opt-in on top of
# `tools`; pulls the async HTTP stack (reqwest). NOT in default — an embedder that
# wants no AtomGit egress skips it.
atomgit = ["tools", "dep:reqwest", "dep:atomcode-auth"]
# Code-intelligence tools (tree-sitter symbol extraction): list_symbols / read_symbol.
# Opt-in (NOT default) — pulls 12 tree-sitter grammar crates (heavy C compilation).
codeintel = [
    "dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-python",
    "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-go",
    "dep:tree-sitter-java", "dep:tree-sitter-c", "dep:tree-sitter-cpp",
    "dep:tree-sitter-c-sharp", "dep:tree-sitter-html", "dep:tree-sitter-php",
    # the cross-file graph layer (build_graph) walks the repo gitignore-aware
    "dep:ignore",
]
# Read-only LSP code intelligence (spawns local language servers, JSON-RPC over stdio).
# Runtime exposure stays opt-in and missing binaries degrade gracefully.
lsp = ["codeintel", "dep:which", "dep:url", "tokio/process", "tokio/io-util", "tokio/fs"]
# Real-server LSP e2e (needs rust-analyzer etc. installed) — default-off, on demand.
lsp-e2e = ["lsp"]
# Desktop / terminal notifications (turn-finished + approval-needed). Reads NotificationConfig
# from the config leaf, so it pulls `atomcode-config`. Opt-in (NOT default) — a provider-only
# embedder skips config→telemetry. Hosts that surface notifications (TUI/CLI) enable it.
notify = ["dep:atomcode-config"]
# One-time project setup/install (scan → seed config → atomic writes, file-locked).
# Pulls the config leaf (i18n + Config) + the light serde/anyhow/sha2/chrono/thiserror/fs2
# stack. Opt-in (NOT default) — only CLI/TUI hosts that run `atomcode setup` enable it.
setup = ["dep:atomcode-config", "dep:anyhow", "dep:sha2", "dep:chrono", "chrono/serde", "dep:fs2", "dep:thiserror", "dep:tempfile", "dep:sysinfo", "dep:tracing", "dep:zstd", "dep:tar"]
# Skills: markdown/frontmatter skill loader + use_skill / list_skills tools. No new deps.
skills = []
# CC-compatible external hooks: run the user's hooks.json commands on the kernel
# seams (LifecycleHooks + ToolMiddleware). Spawns subprocesses, so it pulls the
# process/io tokio features; `dirs` resolves $ATOMCODE_HOME. Opt-in (NOT default).
# `cc_hooks` uses `crate::tools::{request_approval_decision, PermissionDecision, …}`,
# so it needs `tools` — without this it only compiled when a consumer happened to enable
# `tools` transitively (e.g. via `atomgit`).
cc-hooks = ["tools", "dep:dirs", "tokio/process", "tokio/io-util"]
# E2E tests that hit a REAL provider (network + API key). Separate from the default
# suite; run on demand: `cargo test -p atomcode-capabilities --features e2e --test e2e`.
e2e = ["provider"]
# MCP client: connect external MCP servers (stdio/HTTP/OAuth) + surface their tools as
# kernel Tools. Opt-in (NOT default). `reqwest/blocking` powers the one-shot OAuth
# login/refresh flow; transport_http uses the async reqwest client. OAuth's callback
# listener is std::net (no tokio/net needed).
mcp = [
    "dep:anyhow", "dep:sha2", "dep:uuid", "dep:dirs", "dep:toml", "dep:tempfile",
    "dep:reqwest", "reqwest/blocking", "dep:url",
    "tokio/process", "tokio/io-util",
]
# Session persistence + cross-session recall: two-tier on-disk store
# ($ATOMCODE_HOME/sessions/<project_hash>/ — same scheme as production so old/new
# coexist) — a per-turn compacted <id>.snapshot for RESUME + an append-only,
# never-compacted <id>.jsonl transcript for RECALL — plus the SnapshotHook /
# TranscriptHook / recall tool / current-date hook that drive it. Opt-in (NOT default).
session = ["dep:dirs", "dep:chrono", "dep:fs2", "dep:atomcode-config"]
# User-driven persistent memory: the production memory.md store (global
# $ATOMCODE_HOME/memory.md + per-project <root>/.atomcode/memory.md + machine-local
# <root>/.atomcode/local/memory.md, same files so old/new coexist) + a MemoryHook
# that injects the merged entries at session_start. v1 is USER-driven only (driver
# slash-commands write the store); no model-facing remember/forget tools. Opt-in (NOT default).
memory = ["dep:dirs", "dep:ignore"]
# Lazy offline auto-detection: web_search transport failures flip the process
# offline verdict (for offline_mode="auto"). Pulls the config leaf (where the verdict
# lives). Opt-in — a network embedder that doesn't use offline_mode skips it.
offline = ["dep:atomcode-config"]
# The plugin subsystem (loader / installer / marketplace / manifest / trust store),
# ported from core::plugin as a v2 migration target. Synchronous (shells out to `git`
# via std::process — no async runtime). Opt-in (NOT default). Enables `skills` so the
# loader can build a SkillRegistry, plus the auth/config leaves and fs/home helpers.
plugin = [
    "dep:anyhow", "dep:sha2", "dep:url", "dep:toml", "dep:dirs", "dep:tempfile",
    "dep:chrono",
    "dep:atomcode-auth", "dep:atomcode-config",
    "skills",
]

[target.'cfg(unix)'.dependencies]
# Askpass (the `askpass` module): a Unix-socket server + wrapper script that route
# sudo/ssh password prompts to the host UI. Unix-only — `*_ASKPASS` has no Windows
# analogue. Needs the UDS server (tokio net/io-util, unioned onto the base tokio
# features above), `umask`/`/dev/urandom` (libc), and a zeroized password cache.
tokio = { version = "1", features = ["net", "io-util"] }
libc = "0.2"
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# `is_running_as_admin` (process_utils) calls CheckTokenMembership against the
# BUILTIN\Administrators SID to detect elevation without depending on `core`.
# `Win32_System_JobObjects` (+ `Win32_System_Threading` for the IO_COUNTERS that
# JOBOBJECT_EXTENDED_LIMIT_INFORMATION embeds): the Bash tool assigns each shell
# child to a kill-on-close Job Object so timeout/cancel reaps the WHOLE process tree.
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
# Windows SChannel backend for reqwest (dodges rustls-fingerprint RST on *.atomgit.com).
reqwest = { version = "0.12", features = ["native-tls"], default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "net", "test-util"] }
# Local mock HTTP server for deterministic provider tests (retry / multi-round).
wiremock = "0.6"
# Temp dirs for the tool tests; cancellation token construction in tests.
tempfile = "3"
tokio-util = "0.7"
# Redirect ATOMCODE_HOME to a throwaway temp dir before any test runs (via a
# #[ctor] in the lib's #[cfg(test)] module + every tests/*.rs binary) so tests
# that persist sessions/config/memory never write into the developer's real home.
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
atomcode-config = { path = "../atomcode-config", features = ["test-util"] }
serial_test = "3"

# In-tree stdio MCP server used as a deterministic fixture by the `mcp` integration
# tests (tests/mcp.rs). Built only with the `mcp` feature; the test spawns it via the
# CARGO_BIN_EXE_mcp-test-server path Cargo injects.
[[bin]]
name = "mcp-test-server"
path = "src/bin/mcp-test-server.rs"
required-features = ["mcp"]
