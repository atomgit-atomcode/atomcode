[package]
name = "atomcode-codingplan"
version.workspace = true
edition.workspace = true
description = "AtomGit CodingPlan gateway integration — claim / status / usage / setup REST business layer. Leaf crate: depends only on config/auth/telemetry leaves + reqwest, never atomcode-core. Request-signing lives in atomcode-auth::gateway_crypto."
publish = false

[dependencies]
atomcode-config    = { path = "../atomcode-config" }
atomcode-auth      = { path = "../atomcode-auth" }
atomcode-telemetry = { path = "../atomcode-telemetry" }
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows SChannel backend for reqwest (dodges rustls-fingerprint RST on api.gitcode.com).
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[dev-dependencies]
# The moved unit tests build a throwaway home dir for config/auth isolation.
tempfile = "3"
