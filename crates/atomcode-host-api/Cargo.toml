[package]
name = "atomcode-host-api"
version.workspace = true
edition = "2021"
description = "The host-control contract: what a front end asks of whatever hosts its agents (docs/adr/0021 §2)"
publish = false

[dependencies]
# Value types only — `ReasoningEffort`, `SeqNo`, `RewindScope`. The direction is
# host → kernel and never back: this contract grows with the product surface,
# and the whole reason it is its own crate is that the kernel must not move with
# it (`docs/adr/0021`, the 2026-09-18 revision).
atomcode-kernel = { path = "../atomcode-kernel" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"
