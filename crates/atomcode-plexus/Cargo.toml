[package]
name = "atomcode-plexus"
version.workspace = true
edition = "2021"
description = "Spike: an everything-is-a-plugin runtime (Rust take on cordis) — service container, typed events, reversible effects, config-tree mounting"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
