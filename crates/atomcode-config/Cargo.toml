[package]
name = "atomcode-config"
version.workspace = true
edition = "2021"
license.workspace = true
description = "atomcode disk/TOML config system (Config + sub-configs + loader). Leaf crate: depends only on atomcode-telemetry + serde/toml/anyhow, so every stack layer can read config without an atomcode-core dependency."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
atomcode-telemetry = { path = "../atomcode-telemetry" }
# `real_home_dir` (config_dir resolution): home dir + sudo-aware passwd lookup.
dirs = "6"

[target.'cfg(unix)'.dependencies]
# `getpwnam_r` for the sudo-aware home lookup in util::real_home_dir.
libc = "0.2"

[dev-dependencies]
# locale.rs serde round-trip tests.
serde_json = "1"
