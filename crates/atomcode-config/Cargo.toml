[package]
name = "atomcode-config"
version.workspace = true
edition = "2021"
license.workspace = true
description = "atomcode disk/TOML config system (Config + sub-configs + loader). Depends only on atomcode-i18n (itself a leaf) + serde/toml/anyhow, so every stack layer can read config without an atomcode-core dependency."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
anyhow = "1"
url = "2"
# The message tables and the one locale. A leaf with no atomcode dependency of
# its own, so re-exporting it here does not pull a layer in behind it.
atomcode-i18n = { path = "../atomcode-i18n" }
# `real_home_dir` (config_dir resolution): home dir + sudo-aware passwd lookup.
dirs = "6"
# Shared config is mutated by TUI and IDE daemon processes concurrently.
fs2 = "0.4"
# Stable opaque revision for cross-process reconciliation.
sha2 = "0.10"
# Same-directory temporary file + platform-correct atomic replacement.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# `getpwnam_r` for the sudo-aware home lookup in util::real_home_dir.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Read HKCU Internet Settings (the per-user static proxy the system browser uses).
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[features]
test-util = []

[dependencies.serde_json]
version = "1"

[dev-dependencies]
# locale.rs serde round-trip tests — serde_json promoted to [dependencies] for schedule.rs.
