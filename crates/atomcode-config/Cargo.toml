[package]
name = "atomcode-config"
version.workspace = true
edition = "2021"
license.workspace = true
description = "atomcode disk/TOML config system (Config + sub-configs + loader). Leaf crate: depends only on atomcode-telemetry + serde/toml/anyhow, so every stack layer can read config without an atomcode-core dependency."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
anyhow = "1"
url = "2"
atomcode-telemetry = { path = "../atomcode-telemetry" }
# `real_home_dir` (config_dir resolution): home dir + sudo-aware passwd lookup.
dirs = "6"
# Shared config is mutated by TUI and IDE daemon processes concurrently.
fs2 = "0.4"
# Stable opaque revision for cross-process reconciliation.
sha2 = "0.10"
# Same-directory temporary file + platform-correct atomic replacement.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
# `getpwnam_r` for the sudo-aware home lookup in util::real_home_dir.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Read HKCU Internet Settings (the per-user static proxy the system browser uses).
winreg = "0.55"

[features]
test-util = []

[dependencies.serde_json]
version = "1"

[dev-dependencies]
# locale.rs serde round-trip tests — serde_json promoted to [dependencies] for schedule.rs.
