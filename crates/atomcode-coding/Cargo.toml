[package]
name = "atomcode-coding"
version = "0.0.0"
edition = "2021"
description = "L2 coding specialization: assembles the neutral kernel + capabilities into a runnable, self-correcting coding agent."

[dependencies]
atomcode-kernel = { path = "../atomcode-kernel" }
# CodingPlan REST client + types for the RateLimitHook (rate_limit.rs).
# L2 is allowed to depend on core (core does not depend on kernel/capabilities/coding).
atomcode-core = { path = "../atomcode-core" }
# The FULL capability set: L2 is the opinionated assembly — a coding agent ships
# with web/skills/mcp/session/memory wired (the leaner features exist for other
# embedders, not for this crate).
atomcode-capabilities = { path = "../atomcode-capabilities", features = [
    "provider", "tools", "web", "codeintel", "skills", "mcp", "session", "memory",
    # CC-compatible external hooks (hooks.json): production parity with the legacy
    # core engine, which always ran them. Zero overhead when no hooks.json exists
    # (prepare skips registration — see CCExternalHooks::is_empty).
    "cc-hooks",
] }
# The review specialization, mounted as a `code_review` sub-agent TOOL so the coding
# agent can review the current changes in-session (L2 composing a sibling L2).
atomcode-review = { path = "../atomcode-review" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
# Stream proxying for the compaction-summary telemetry provider decorator (folds
# StreamEvent::Usage, emits one LlmChat at stream end). Also used by tests.
futures = "0.3"
# Telemetry re-enters the neutral kernel via a LifecycleHooks adapter (the kernel's
# designated `on_request`/`on_model_response` seam), wired here at assembly.
atomcode-telemetry = { path = "../atomcode-telemetry" }
# Fresh session-id allocation (the assembly is the session_id's single owner).
uuid = { version = "1", features = ["v4"] }
dirs = "6"
# Day-granular date anchor frozen into the persona (system prompt) so the model
# has a current-date reference on every round — v1 prompt.rs parity.
chrono = "0.4"

[dev-dependencies]
serde_json = "1"
# in-memory capturing Telemetry for the TelemetryHook test.
atomcode-telemetry = { path = "../atomcode-telemetry", features = ["test-util"] }
# atomcode-kernel::testkit (MockProvider, scripted StreamEvents) is ungated — no extra dep.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
async-trait = "0.1"
# Serialize tests that mutate the process-global ATOMCODE_HOME env var so they
# don't race (cache_prefix asserts byte-identical system prompt across assemblies).
serial_test = "3"
