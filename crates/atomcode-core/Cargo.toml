[package]
name = "atomcode-core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
# Config system is being extracted here (leaf crate); core re-exports it during the
# transition. See docs/superpowers/plans/2026-07-11-extract-atomcode-config.md.
atomcode-config = { path = "../atomcode-config" }
# `auth` (OAuth login + secure token file) extracted to this leaf; core re-exports it as
# `atomcode_core::auth` during the transition.
atomcode-auth = { path = "../atomcode-auth" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
http = "1"
# `rustls-tls` (webpki base roots) — an INFALLIBLE base so `.build()` never
# hard-fails on certs. OS native roots + SSL_CERT_FILE are layered on TOP,
# gracefully, in `build_http_client` (see `add_trusted_roots`). We deliberately
# do NOT use `rustls-tls-native-roots`: reqwest reads native roots / SSL_CERT_FILE
# STRICTLY there and fails the build ("zero valid certificates …") on a bad
# SSL_CERT_FILE or empty store — which cascades into panics at every `.build()`
# call site. Graceful, additive loading (codex-style) avoids that. See #514.
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "blocking"], default-features = false }
# OS native root store loader (Windows cert manager / macOS keychain / Linux
# /etc/ssl/certs) for corporate MITM-proxy CAs. Loaded best-effort. See #514.
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time", "net"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

globset = "0.4"
regex = "1"
bincode = "1"
# Decode Chinese Windows text files (GBK/GB18030) that fail UTF-8 validation.
# Used by read_file's fallback path.
encoding_rs = "0.8"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
thiserror = "1"
tracing = "0.1"
atomcode-telemetry = { path = "../atomcode-telemetry" }

# AtomCode request-signing crate. Stub in the open-source tree; the
# official build pipeline replaces `crates/atomcode-codingplan-crypto/`
# with the closed-source overlay and turns the feature on. Off by
# default — the stub crate is linked only when this feature is enabled,
# never in standard `cargo build`.
htmd = "0.5.4"

[features]
default = []
codingplan-crypto = ["atomcode-auth/codingplan-crypto"]

# Non-blocking poll on stdin in the OAuth callback path so the stdin
# reader thread can exit cleanly when the HTTP listener wins — otherwise
# it stays blocked in read_line() and steals the user's first keystroke
# after login returns.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Foundation"] }
# Windows SChannel backend for reqwest (dodges rustls-fingerprint RST). See release TLS fix.
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
serial_test = "3"
atomcode-config = { path = "../atomcode-config", features = ["test-util"] }
# Redirects ATOMCODE_HOME to a temp dir at test startup so tests don't pollute
# the real ~/.atomcode (see the `#[ctor]` in lib.rs / the crate docs).
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
# `test-util` enables tokio's paused-clock test helpers (start_paused /
# time::pause / advance) used by the self-paced /loop wrapper tests. Dev-only:
# cargo unions this with the main tokio dependency, so the prod build is
# unaffected.
tokio = { version = "1", features = ["test-util"] }
atomcode-telemetry = { path = "../atomcode-telemetry", features = ["test-util"] }
