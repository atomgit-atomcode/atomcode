[package]
name = "atomcode-core"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
# What core still holds: the reqwest-applying proxy runtime policy (see src/proxy.rs).
# It re-exports config's proxy/tls types and applies them to reqwest builders — the
# two fns that can't live in the reqwest-free leaf `atomcode-config`.
atomcode-config = { path = "../atomcode-config" }
# Kept ONLY for the `codingplan-crypto` feature forward below (proprietary build
# pipeline). Core no longer uses `atomcode-auth` in code.
atomcode-auth = { path = "../atomcode-auth" }
# `rustls-tls` base + `blocking` — proxy policy applies `.no_proxy()` /
# `.max_tls_version(TLS_1_2)` to both async and blocking client builders. On
# Windows the target block below swaps to `native-tls`.
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls", "blocking"], default-features = false }

[features]
default = []
codingplan-crypto = ["atomcode-auth/codingplan-crypto"]

# Windows SChannel backend for reqwest (dodges rustls-fingerprint RST) — the proxy
# policy applies to the Windows client builder too. See release TLS fix.
[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.12", features = ["native-tls"], default-features = false }

[dev-dependencies]
tempfile = "3"
# Read session jsonl fixtures in tests/ (session_fixture_invariants_test).
serde_json = "1"
atomcode-config = { path = "../atomcode-config", features = ["test-util"] }
# Redirects ATOMCODE_HOME to a temp dir at test startup so tests don't pollute
# the real ~/.atomcode (see the `#[ctor]` in lib.rs / the crate docs).
atomcode-kernel = { path = "../atomcode-kernel", features = ["test-support"] }
ctor = "0.2"
# `test-util` enables tokio's paused-clock test helpers (start_paused /
# time::pause / advance) used by the self-paced /loop wrapper tests. Dev-only:
# cargo unions this with the main tokio dependency, so the prod build is
# unaffected.
tokio = { version = "1", features = ["test-util"] }
atomcode-telemetry = { path = "../atomcode-telemetry", features = ["test-util"] }
