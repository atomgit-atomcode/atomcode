name: check

# `build.yml` only fires on `v*` tags and only runs `cargo build` (which skips
# every test target) plus one `cargo test -p atomcode-updater --lib`. That is
# how the `ToolMiddleware::after` signature drift in
# `crates/atomcode-kernel/tests/conformance.rs` stayed invisible for a week and
# shipped in v5.0.9. This workflow is the pre-merge gate that closes that hole.
on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: compile + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # ~94 test sites spawn `git`; a bare runner has no committer identity.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      # BLOCKING. The cheap gate, and the one that matters: `--all-targets`
      # reaches the `tests/` integration targets that `cargo build` never
      # compiles, and `--workspace` reaches the 10 crates outside
      # `default-members` that a bare `cargo test` never selects. This step
      # alone would have caught the v5.0.9 break, on the day it landed.
      - name: cargo check (all crates, all targets)
        run: cargo check --workspace --all-targets

      # `cargo test` runs one test binary to completion before starting the
      # next, and this workspace has 91 integration test files. Measured on
      # atomcode-kernel's 305 tests: `cargo test` 570s, of which only 1.3s was
      # CPU — the rest was idle waiting. nextest runs them process-per-test
      # across binaries: 0.64s. Process isolation also suits what this suite
      # does to the host (the spawns and port binds noted below) better than
      # `cargo test`'s threads-in-one-process model.
      # See AGENTS.md, "测试与构建命令".
      #
      # Report-only like the two steps that consume it: this is infrastructure
      # for a gate that cannot fail a PR yet, so a transient download failure
      # must not fail one either. Promote it together with them.
      - name: Install cargo-nextest
        continue-on-error: true
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Report-only for now. The suite is green locally on macOS
      # (5711 passed / 0 failed at ecc9781a), but it has not yet run on a
      # Linux runner and it touches the host in ways CI often refuses:
      # ~94 external-command spawns, ~27 `$HOME` lookups, ~24 port binds.
      # PROMOTE THIS: once a run is green here, delete the
      # `continue-on-error` line below — a test gate that cannot fail a PR is
      # not a gate.
      #
      # `--profile ci` is the block in `.config/nextest.toml`: no fail-fast (a
      # first Linux run should report every failure, not just the first), one
      # retry (aimed at the port binds), `test-threads = "num-cpus"` so the
      # runner's core count wins over the dev machine's tuned value, and a
      # slow-test timeout loosened to 60s/240s so a slower runner does not make
      # its debut red on timing alone.
      - name: cargo nextest (all crates)
        continue-on-error: true
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests — this keeps that coverage, which the
      # `cargo test --workspace` above used to carry. Report-only on the same
      # contract as the step above; promote both together.
      - name: cargo test --doc (all crates)
        continue-on-error: true
        run: cargo test --workspace --doc

  lint:
    name: fmt (blocking) + clippy (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # BLOCKING as of the tree-wide `cargo fmt --all` that cleared the backlog
      # (93 files / 407 hunks). It stays blocking only while the backlog is zero:
      # the whole reason this was report-only is that a gate which is red on its
      # first run gets switched off. If this ever goes red on a PR, the fix is to
      # run `cargo fmt --all` in that PR — never to re-add `continue-on-error`.
      #
      # One caveat if it ever fails on a file nobody touched: rustfmt does not
      # converge on a `format!` whose long string literal sits in a match arm
      # (`cargo fmt` leaves it, `--check` still reports it). Fix it the way
      # `bash_start`'s argument error was fixed — block-form the arm and split
      # the literal with a `\` continuation — rather than switching the gate off.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Still report-only: 598 warnings outstanding (atomcode-tuix alone
      # accounts for 291). Same contract as fmt above — drop this
      # `continue-on-error` once that backlog reaches zero.
      - name: cargo clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
