<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}'; font-src {{cspSource}};">
  <link rel="stylesheet" href="{{styleUri}}">
  <title>AtomCode</title>
</head>
<body>
  <div id="app">

    <!-- Header Bar -->
    <header id="header">
      <div class="header-left">
        <button id="btn-history" class="header-btn" title="Session History">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="2" y="3" width="12" height="1.5" rx="0.5"/>
            <rect x="2" y="7" width="12" height="1.5" rx="0.5"/>
            <rect x="2" y="11" width="12" height="1.5" rx="0.5"/>
          </svg>
        </button>
        <span class="header-title">AtomCode</span>
      </div>
      <div class="header-right">
        <div id="model-selector" class="model-selector">
          <button id="btn-model" class="header-btn model-btn" title="Select Model">
            <span id="current-model-label">default</span>
            <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor">
              <path d="M2 3.5L5 7L8 3.5" stroke="currentColor" stroke-width="1.2" fill="none"/>
            </svg>
          </button>
          <div id="model-dropdown" class="dropdown hidden">
            <div class="dropdown-header">Models</div>
            <div id="model-list" class="dropdown-list"></div>
          </div>
        </div>
        <button id="btn-new" class="header-btn" title="New Conversation">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
        </button>
        <button id="btn-settings" class="header-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 10a2 2 0 100-4 2 2 0 000 4z"/>
            <path d="M13.3 6.7l-1-.3a4.5 4.5 0 00-.5-.8l.3-1a.5.5 0 00-.1-.5l-.8-.8a.5.5 0 00-.5-.1l-1 .3a4.5 4.5 0 00-.9-.4l-.3-1A.5.5 0 008 2.5h-1a.5.5 0 00-.5.4l-.3 1a4.5 4.5 0 00-.8.4l-1-.3a.5.5 0 00-.5.1l-.7.8a.5.5 0 00-.1.5l.3 1a4.5 4.5 0 00-.4.8l-1 .3a.5.5 0 00-.4.5v1a.5.5 0 00.4.5l1 .3a4.5 4.5 0 00.4.8l-.3 1a.5.5 0 00.1.5l.8.8a.5.5 0 00.5.1l1-.3c.3.2.5.3.8.4l.3 1a.5.5 0 00.5.4h1a.5.5 0 00.5-.4l.3-1a4.5 4.5 0 00.8-.4l1 .3a.5.5 0 00.5-.1l.8-.8a.5.5 0 00.1-.5l-.3-1c.2-.3.3-.5.4-.8l1-.3a.5.5 0 00.4-.5v-1a.5.5 0 00-.4-.5z" fill="none" stroke="currentColor" stroke-width="1"/>
          </svg>
        </button>
        <button id="btn-popout" class="header-btn" title="Open in Editor">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M9 2h5v5M14 2L7 9M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Session History Panel -->
    <aside id="history-panel" class="hidden">
      <div class="history-search">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" class="search-icon">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <line x1="9.5" y1="9.5" x2="13" y2="13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <input id="history-search-input" type="text" placeholder="Search sessions..." />
      </div>
      <div id="history-list" class="history-list">
        <div class="history-empty">No session history</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content">

      <!-- Welcome Screen -->
      <div id="welcome-screen" class="welcome-screen">
        <div class="welcome-hero">
          <div class="welcome-icon">&#10022;</div>
          <h1 class="welcome-title">AtomCode</h1>
          <p class="welcome-subtitle">AI Coding Agent by AtomGit</p>
        </div>
        <div class="welcome-cards">
          <button class="welcome-card" data-action="explain">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 12a1 1 0 110-2 1 1 0 010 2zm1-4.5a1 1 0 01-2 0V7a1 1 0 112 0v2.5z"/>
              </svg>
            </div>
            <div class="welcome-card-label">Explain Selection</div>
          </button>
          <button class="welcome-card" data-action="fix">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M13.7 2.3a1 1 0 011.4 0l2.6 2.6a1 1 0 010 1.4l-9 9a1 1 0 01-.5.3l-4 1a1 1 0 01-1.2-1.2l1-4a1 1 0 01.3-.5l9-9z"/>
              </svg>
            </div>
            <div class="welcome-card-label">Fix Code Issue</div>
          </button>
          <button class="welcome-card" data-action="test">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M7 2v4H5a1 1 0 00-1 1v10a1 1 0 001 1h10a1 1 0 001-1V7a1 1 0 00-1-1h-2V2H7zm2 0v4h2V2H9zm-3 8l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="welcome-card-label">Write Tests</div>
          </button>
          <button class="welcome-card" data-action="refactor">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M4 4l4 4M12 4l-4 4M4 16l4-4M12 16l-4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <path d="M16 3v4h-4M16 17v-4h-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <div class="welcome-card-label">Refactor Code</div>
          </button>
          <button class="welcome-card" data-action="docs">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <path d="M4 2h8l4 4v12a1 1 0 01-1 1H4a1 1 0 01-1-1V3a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.3"/>
                <path d="M6 10h8M6 13h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="welcome-card-label">Add Docs</div>
          </button>
          <button class="welcome-card" data-action="review">
            <div class="welcome-card-icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                <circle cx="10" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/>
                <line x1="14.5" y1="13.5" x2="18" y2="17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="welcome-card-label">Review Code</div>
          </button>
        </div>
        <div class="welcome-quick">
          <span class="welcome-quick-label">Quick:</span>
          <button class="welcome-quick-btn" data-command="/fix">/fix</button>
          <button class="welcome-quick-btn" data-command="/explain">/explain</button>
          <button class="welcome-quick-btn" data-command="/test">/test</button>
          <button class="welcome-quick-btn" data-command="/review">/review</button>
        </div>
      </div>

      <!-- Messages Container -->
      <div id="messages"></div>

      <!-- Generating Indicator -->
      <div id="generating-indicator" class="hidden">
        <div class="generating-content">
          <div class="generating-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="generating-text">
            <span class="generating-label">AtomCode is thinking...</span>
            <span id="generating-status" class="generating-status"></span>
          </div>
          <button id="btn-stop" class="btn-stop" title="Stop Generation">Stop</button>
        </div>
      </div>

    </main>

    <!-- Input Area -->
    <footer id="input-area">
      <div id="context-tags" class="context-tags hidden"></div>
      <div id="input-wrapper">
        <textarea id="input" placeholder="Ask AtomCode... (@ to mention, / for commands)" rows="1"></textarea>
        <button id="btn-send" title="Send (Enter)" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 14l10-6L3 2v4.5l6 1.5-6 1.5V14z"/>
          </svg>
        </button>
      </div>
      <div id="input-footer">
        <div class="input-footer-left">
          <button id="btn-attach" class="footer-action" title="Attach File">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
              <path d="M12.3 5.7L6.5 11.5a3 3 0 01-4.2-4.2L9 .5a2 2 0 012.8 2.8L5.5 9.7a1 1 0 01-1.4-1.4L10.3 2" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>
            </svg>
            <span>Attach</span>
          </button>
        </div>
        <div class="input-footer-right">
          <span class="input-hint">Enter &#8629; Send</span>
          <span class="input-separator">|</span>
          <span id="token-count" class="token-count"></span>
        </div>
      </div>

      <!-- Slash Command Picker -->
      <div id="slash-picker" class="slash-picker hidden">
        <div class="slash-picker-header">Commands</div>
        <div id="slash-list" class="slash-list"></div>
      </div>

      <!-- @ Mention Picker -->
      <div id="mention-picker" class="mention-picker hidden">
        <div class="mention-picker-header">Files</div>
        <div id="mention-list" class="mention-list"></div>
      </div>
    </footer>

  </div>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
