# =============================================================================
# AtomCode 配置模板
#
# 复制到 ~/.atomcode/config.toml 后按需修改。Provider 可声明多个，
# 在 TUI 中用 /provider 或 /model 切换。
# =============================================================================

# ---- 默认 provider（必须匹配下方某个 [providers.*] 的键名）----
default_provider = "deepseek"

# ---- 自动更新 / 自动提交（顶层键，必须在任何 [表] 之前）----
# auto_update: 每小时轮询新版本并预暂存，下次启动时应用（/upgrade 仍可手动）
# auto_commit: 每轮 agent 结束后自动提交改动的文件（仅在 git 仓库内生效）
auto_update = true
auto_commit = false

# =============================================================================
# Provider 示例
# =============================================================================

# -------- DeepSeek ----------
[providers.deepseek]
type = "openai"
api_key = "sk-..."
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
context_window = 64000

# DeepSeek V4 专属：推理历史回显策略
# (unset = auto-detect: deepseek-v4* → include, deepseek-reasoner/r1 → exclude)
# reasoning_history = "include"  # 或 "exclude"
# reasoning_effort = "high"

# -------- 智谱 GLM-5.2（通过 Zhipu API）----------
[providers.glm]
type = "openai"
api_key = "sk-..."
model = "glm-5.2"
base_url = "https://open.bigmodel.cn/api/paas/v4"
context_window = 1000000
max_tokens = 131072

# 推理强度调节（high / max）
# 参考：https://docs.z.ai/guides/llm/glm-5.2

# -------- 智谱 GLM-5.2 1M 上下文（显式启用）----------
# [providers."glm-5.2-1m"]
# type = "openai"
# api_key = "sk-..."
# model = "glm-5.2[1m]"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
# context_window = 1000000

# -------- Claude（Anthropic）----------
[providers.claude]
type = "claude"
api_key = "sk-ant-..."
model = "claude-sonnet-4-6"
base_url = "https://api.anthropic.com/v1"
context_window = 200000

# -------- OpenAI ----------
[providers.openai]
type = "openai"
api_key = "sk-proj-..."
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
context_window = 128000

# -------- Ollama（本地）----------
[providers.ollama]
type = "ollama"
model = "qwen3:14b"
base_url = "http://localhost:11434"
context_window = 32000

# -------- 通义千问 Qwen ----------
[providers.qwen]
type = "openai"
api_key = "sk-..."
model = "qwen-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
context_window = 131072

# -------- SiliconFlow ----------
[providers.siliconflow]
type = "openai"
api_key = "sk-..."
model = "deepseek-ai/DeepSeek-V3"
base_url = "https://api.siliconflow.cn/v1"
context_window = 64000

