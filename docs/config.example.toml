# =============================================================================
# AtomCode 配置模板
#
# 复制到 ~/.atomcode/config.toml 后按需修改。Provider 可声明多个，
# 在 TUI 中用 /provider 或 /model 切换。
# =============================================================================

# ---- 默认 provider（必须匹配下方某个 [providers.*] 的键名）----
default_provider = "deepseek"

# ---- 自动更新 / 自动提交（顶层键，必须在任何 [表] 之前）----
# auto_update: 每小时轮询新版本并预暂存，下次启动时应用（/upgrade 仍可手动）
# auto_commit: 每轮 agent 结束后自动提交改动的文件（仅在 git 仓库内生效）
auto_update = true
auto_commit = false

# ---- 离线 / 内网无公网环境开关（顶层键）----
# offline_mode: 离线 / 内网无公网环境开关。
#   "off"  (默认) — 正常联网行为，一切不变。
#   "on"   — 移除 web_fetch/web_search，停用遥测与自动更新，并告知模型处于离线环境
#            （优先离线友好写法：不引外部 CDN、不做联网安装）。
#   "auto" — 乐观联网；观察到一次联网失败后自动转为离线。
# 环境变量 ATOMCODE_OFFLINE=1|0|auto 覆盖此项（优先级更高）。
offline_mode = "off"

# offline_note (可选): 声明本机内网可用的镜像/私服，会拼接进离线系统提示，
# 让模型知道哪些私服可用（如 npm 私服），避免过度保守。留空则不拼接。
# offline_note = "npm 私服 registry=http://nexus.internal:8081（可正常 npm install）；Maven 走内部仓库；pip index 已配"

# =============================================================================
# Provider 示例
# =============================================================================

# ─── Example: AtomGit CodingPlan (recommended) ───
# Run `atomcode login` to auto-configure via OAuth, which writes
# providers like the one below. Manual setup is for reference only.
#
# [providers.AtomGit-deepseek-v4-flash]
# type = "openai"
# api_key = "<your-codingplan-api-key>"
# model = "deepseek-v4-flash"
# base_url = "https://llm-api.atomgit.com/v1"
# context_window = 1000000
#
# [providers.AtomGit-Qwen-Qwen3-VL-8B-Instruct]
# type = "openai"
# api_key = "<your-codingplan-api-key>"
# model = "Qwen/Qwen3-VL-8B-Instruct"
# base_url = "https://llm-api.atomgit.com/v1"
# context_window = 64000
# ─────────────────────────────────────────────────

# -------- DeepSeek ----------
[providers.deepseek]
type = "openai"
api_key = "sk-..."
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
context_window = 64000

# DeepSeek V4 专属：推理历史回显策略
# (unset = auto-detect: deepseek-v4* → include, deepseek-reasoner/r1 → exclude)
# reasoning_history = "include"  # 或 "exclude"
# reasoning_effort = "high"

# -------- 智谱 GLM-5.2（通过 Zhipu API）----------
[providers.glm]
type = "openai"
api_key = "sk-..."
model = "glm-5.2"
base_url = "https://open.bigmodel.cn/api/paas/v4"
context_window = 1000000
max_tokens = 131072

# 推理强度调节（high / max）
# 参考：https://docs.z.ai/guides/llm/glm-5.2

# -------- 智谱 GLM-5.2 1M 上下文（显式启用）----------
# [providers."glm-5.2-1m"]
# type = "openai"
# api_key = "sk-..."
# model = "glm-5.2[1m]"
# base_url = "https://open.bigmodel.cn/api/paas/v4"
# context_window = 1000000

# -------- Claude（Anthropic）----------
[providers.claude]
type = "claude"
api_key = "sk-ant-..."
model = "claude-sonnet-4-6"
base_url = "https://api.anthropic.com/v1"
context_window = 200000

# -------- OpenAI ----------
[providers.openai]
type = "openai"
api_key = "sk-proj-..."
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
context_window = 128000

# -------- Ollama（本地）----------
[providers.ollama]
type = "ollama"
model = "qwen3:14b"
base_url = "http://localhost:11434"
context_window = 32000

# -------- 通义千问 Qwen ----------
[providers.qwen]
type = "openai"
api_key = "sk-..."
model = "qwen-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
context_window = 131072

# -------- SiliconFlow ----------
[providers.siliconflow]
type = "openai"
api_key = "sk-..."
model = "deepseek-ai/DeepSeek-V3"
base_url = "https://api.siliconflow.cn/v1"
context_window = 64000

