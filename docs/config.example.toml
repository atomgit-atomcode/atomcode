default_provider = "deepseek"
 
[providers.deepseek]
type           = "openai"
api_key        = "sk-..."
model          = "deepseek-chat"
base_url       = "https://api.deepseek.com/v1"
context_window = 64000

# Per-turn datalog settings. Each turn writes a markdown file
# (plus a .jsonl of raw LLM requests) into `dir`.
# - enabled = false        -> disable logging entirely
# - dir unset (default)    -> writes to <working_dir>/datalog/ (follows /cd)
# - dir = "/abs/path"      -> absolute, fixed (unaffected by /cd)
# - dir = "~/sub"          -> expanded from $HOME, fixed
# - dir = "rel/path"       -> joined with current working_dir, follows /cd
[datalog]
enabled = true
# dir = "~/.atomcode/datalog"  # example: uncomment to redirect
