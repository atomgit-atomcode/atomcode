default_provider = "deepseek"
 
[providers.deepseek]
type = "openai"
api_key = "sk-..."
model = "deepseek-chat"
base_url = "https://api.deepseek.com/v1"
context_window = 64000

# Per-turn datalog settings. Each turn writes a markdown file
# (plus a .jsonl of raw LLM requests) into `dir`.
# - enabled = false        -> disable logging entirely
# - dir unset (default)    -> writes to <working_dir>/datalog/ (follows /cd)
# - dir = "/abs/path"      -> absolute, fixed (unaffected by /cd)
# - dir = "~/sub"          -> expanded from $HOME, fixed
# - dir = "rel/path"       -> joined with current working_dir, follows /cd
[datalog]
enabled = true
# dir = "~/.atomcode/datalog"  # example: uncomment to redirect

# The `/whip` / Ctrl+G "urge the agent" feature. Plays a 5-row ASCII
# whip-sweep animation and (when a turn is running) prepends a random
# encouragement phrase to the next LLM call via AppendInput — no
# cancellation, no model/temperature change.
# - enabled      : false silences both Ctrl+G and /whip entirely
# - cooldown_ms  : minimum gap between successive fires
# - phrases      : when non-empty, REPLACES the built-in bilingual pool
[whip]
enabled = true
cooldown_ms = 1000
# phrases = ["FASTER", "快点", "赶紧的"]
