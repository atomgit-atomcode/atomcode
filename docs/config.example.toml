# =============================================================================
# 多 provider 切换快捷键
# =============================================================================
# 在 TUI 中输入 /provider 打开 provider 管理界面
# 输入 /model 在当前 provider 下切换模型

# =============================================================================
# 数据日志（每轮对话写入 Markdown 摘要 + JSON 请求/响应）
# =============================================================================
[datalog]
enabled = true
dir = "~/.atomcode/datalog"

# =============================================================================
# 通知
# =============================================================================
[notifications]
enabled = true
min_duration_secs = 8
terminal = true
system = true
bell = true
background_only = true

# =============================================================================
# 网络代理
# =============================================================================
[network.proxy]
mode = "no_proxy"
# http = "http://127.0.0.1:7890"
# https = "http://127.0.0.1:7890"
# all = "socks5://127.0.0.1:7890"
# no_proxy = "localhost,127.0.0.1"

# =============================================================================
# Subagent 设置（并行子代理）
# =============================================================================
[subagent]
enabled = true
initial_turns = 4
max_turns = 12
max_concurrent = 3
timeout_secs = 300

# =============================================================================
# LSP（语言服务器协议）
# =============================================================================
[lsp]
enabled = false
auto_detect = false
diagnostics_settle_delay_ms = 150

# =============================================================================
# 插件
# =============================================================================
[plugin]
auto_install_default_skills = true
auto_update_marketplaces = true

# =============================================================================
# UI
# =============================================================================
[ui]
theme = "auto"
auto_copy_on_select = true

# =============================================================================
# 自动更新
# =============================================================================
auto_update = true
auto_commit = false
